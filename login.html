<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑰𝑪𝑶 | منصة الاستضافة الخارقة والذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #f8fafc;
            direction: rtl;
            font-size: 14px;
        }
        :root {
            --primary: #6366f1; --primary-light: #818cf8; --secondary: #ec4899;
            --accent: #8b5cf6; --success: #10b981; --danger: #ef4444;
            --radius-md: 16px; --radius-xl: 32px; --transition: all 0.3s ease;
        }
        .hidden { display: none !important; }
        .btn {
            padding: 12px 24px; border: none; border-radius: var(--radius-md);
            font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); }
        .login-wrapper {
            width: 100%; max-width: 450px; background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px); border-radius: var(--radius-xl); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
        }
        .login-header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 30px; text-align: center; color: white; }
        .login-tabs { display: flex; padding: 12px 12px 0; gap: 8px; background: rgba(15, 23, 42, 0.5); }
        .login-tab {
            flex: 1; padding: 12px; border: none; background: rgba(255, 255, 255, 0.05); color: #94a3b8;
            font-weight: 600; cursor: pointer; border-radius: var(--radius-md) var(--radius-md) 0 0; transition: var(--transition);
        }
        .login-tab.active { background: rgba(30, 41, 59, 0.9); color: var(--primary-light); border-top: 2px solid var(--primary); }
        .login-content { background: rgba(30, 41, 59, 0.9); padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 6px; color: #cbd5e1; font-weight: 500; font-size: 13px; }
        .form-input {
            width: 100%; padding: 12px 16px; border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md); font-size: 14px; background: rgba(15, 23, 42, 0.6); color: white;
        }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .app-wrapper {
            width: 100%; max-width: 1300px; margin: 0 auto; background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px); border-radius: var(--radius-xl); border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
        }
        .navbar { background: rgba(30, 41, 59, 0.85); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .upload-area {
            margin: 24px; border: 3px dashed rgba(255, 255, 255, 0.2); border-radius: var(--radius-xl);
            padding: 36px; text-align: center; background: rgba(30, 41, 59, 0.5); cursor: pointer;
        }
        .file-input { display: none; }
        .file-input-label { background: var(--primary); color: white; padding: 10px 28px; border-radius: var(--radius-md); cursor: pointer; display: inline-block; }
        .toast {
            position: fixed; top: 20px; left: 20px; background: rgba(30, 41, 59, 0.95); color: white; padding: 12px 20px;
            border-radius: var(--radius-md); z-index: 9999; transform: translateX(150%); transition: transform 0.3s ease; border-right: 4px solid var(--success);
        }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>
    <div class="toast" id="toast"><div id="toastText">تمت العملية بنجاح</div></div>

    <!-- Login Container -->
    <div class="login-wrapper" id="loginContainer">
        <div class="login-header"><h1>منصة ICO الخارقة</h1><p>استضافة متكاملة (HTML, JS, PHP, Python)</p></div>
        <div class="login-tabs">
            <button class="login-tab active" data-tab="login">تسجيل الدخول</button>
            <button class="login-tab" data-tab="register">إنشاء حساب</button>
        </div>
        <div class="login-content">
            <div id="loginForm">
                <div class="form-group"><label class="form-label">البريد الإلكتروني أو اسم المستخدم</label><input type="text" id="loginEmail" class="form-input"></div>
                <div class="form-group"><label class="form-label">كلمة المرور</label><input type="password" id="loginPassword" class="form-input"></div>
                <button class="btn btn-primary" id="loginSubmit" style="width: 100%;">دخول</button>
            </div>
            <div id="registerForm" class="hidden">
                <div class="form-group"><label class="form-label">اسم المستخدم</label><input type="text" id="regUsername" class="form-input"></div>
                <div class="form-group"><label class="form-label">البريد الإلكتروني</label><input type="email" id="regEmail" class="form-input"></div>
                <div class="form-group"><label class="form-label">كلمة المرور</label><input type="password" id="regPassword" class="form-input"></div>
                <button class="btn btn-primary" id="regSubmit" style="width: 100%;">إنشاء الحساب</button>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div class="app-wrapper hidden" id="mainContainer">
        <nav class="navbar">
            <div style="font-weight: 700; font-size: 18px; color: #818cf8;">منصة الاستضافة الذكية</div>
            <div>
                <span id="userDisplay" style="margin-left: 15px;"></span>
                <button class="btn btn-primary" id="logoutBtn" style="padding: 6px 14px; font-size: 12px;">خروج</button>
            </div>
        </nav>
        <div class="upload-area" id="uploadArea">
            <h3>رفع ملف جديد (HTML, JS, PHP, Python)</h3>
            <p style="margin: 10px 0; color: #94a3b8;">اختر الملف لبدء تشغيله على السيرفر فوراً</p>
            <label class="file-input-label">اختر ملف<input type="file" id="fileInput" class="file-input" accept=".html,.htm,.js,.php,.py"></label>
            <div id="fileName" style="margin-top: 10px; color: #818cf8;"></div>
        </div>
        <div style="padding: 0 24px 24px; text-align: center;">
            <button class="btn btn-primary" id="uploadBtn" style="width: 100%;">رفع الملف وتشغيل السيرفر</button>
        </div>
        <div id="resultBox" class="hidden" style="margin: 24px; padding: 20px; background: rgba(15, 23, 42, 0.8); border-radius: var(--radius-md);">
            <p style="margin-bottom: 8px; color: #94a3b8;">رابط الموقع المباشر:</p>
            <a id="siteLink" href="#" target="_blank" style="color: #38bdf8; word-break: break-all;"></a>
        </div>
    </div>

    <script>
        const E = {
            loginContainer: document.getElementById('loginContainer'),
            mainContainer: document.getElementById('mainContainer'),
            loginEmail: document.getElementById('loginEmail'),
            loginPassword: document.getElementById('loginPassword'),
            loginSubmit: document.getElementById('loginSubmit'),
            regUsername: document.getElementById('regUsername'),
            regEmail: document.getElementById('regEmail'),
            regPassword: document.getElementById('regPassword'),
            regSubmit: document.getElementById('regSubmit'),
            userDisplay: document.getElementById('userDisplay'),
            logoutBtn: document.getElementById('logoutBtn'),
            fileInput: document.getElementById('fileInput'),
            fileName: document.getElementById('fileName'),
            uploadBtn: document.getElementById('uploadBtn'),
            resultBox: document.getElementById('resultBox'),
            siteLink: document.getElementById('siteLink'),
            toast: document.getElementById('toast'),
            toastText: document.getElementById('toastText')
        };

        function showToast(msg) {
            E.toastText.textContent = msg;
            E.toast.classList.add('show');
            setTimeout(() => E.toast.classList.remove('show'), 3000);
        }

        // التبديل بين التابات
        document.querySelectorAll('.login-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.login-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if(btn.dataset.tab === 'login') {
                    document.getElementById('loginForm').classList.remove('hidden');
                    document.getElementById('registerForm').classList.add('hidden');
                } else {
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('registerForm').classList.remove('hidden');
                }
            });
        });

        // تسجيل الدخول
        E.loginSubmit.addEventListener('click', async () => {
            const email = E.loginEmail.value.trim();
            const password = E.loginPassword.value;
            if(!email || !password) return showToast("أدخل جميع البيانات المطلوبة");

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                showToast("تم تسجيل الدخول بنجاح");
                checkUser();
            } else {
                showToast(data.message || "خطأ في بيانات الدخول");
            }
        });

        // تسجيل حساب جديد
        E.regSubmit.addEventListener('click', async () => {
            const username = E.regUsername.value.trim();
            const email = E.regEmail.value.trim();
            const password = E.regPassword.value;
            if(!username || !email || !password) return showToast("أدخل جميع البيانات");

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if(data.success) {
                showToast("تم إنشاء الحساب، يجاري تسجيل الدخول...");
                setTimeout(() => {
                    E.loginEmail.value = email;
                    E.loginPassword.value = password;
                    E.loginSubmit.click();
                }, 1000);
            } else {
                showToast(data.message || "فشل التسجيل");
            }
        });

        E.logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout');
            location.reload();
        });

        E.fileInput.addEventListener('change', () => {
            if(E.fileInput.files[0]) E.fileName.textContent = E.fileInput.files[0].name;
        });

        let activeFolder = null;
        E.uploadBtn.addEventListener('click', async () => {
            const file = E.fileInput.files[0];
            if(!file) return showToast("اختر ملفاً أولاً");

            // إنشاء سيرفر مؤقت للملف المرفوع
            const srvRes = await fetch('/api/server/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: file.name, server_type: 'HTML' })
            });
            const srvData = await srvRes.json();
            if(!srvData.success) return showToast("فشل إنشاء حاوية الملف");

            activeFolder = srvData.folder;
            const formData = new FormData();
            formData.append('file', file);

            const upRes = await fetch(`/api/files/upload/${activeFolder}`, {
                method: 'POST',
                body: formData
            });
            const upData = await upRes.json();
            if(upData.success) {
                showToast("تم رفع وتشغيل الملف بنجاح!");
                const fullUrl = window.location.origin + upData.url;
                E.siteLink.href = fullUrl;
                E.siteLink.textContent = fullUrl;
                E.resultBox.classList.remove('hidden');
            } else {
                showToast("فشل رفع الملف");
            }
        });

        async function checkUser() {
            const res = await fetch('/api/current_user');
            const data = await res.json();
            if(data.success) {
                E.loginContainer.classList.add('hidden');
                E.mainContainer.classList.remove('hidden');
                E.userDisplay.textContent = data.username;
            } else {
                E.loginContainer.classList.remove('hidden');
                E.mainContainer.classList.add('hidden');
            }
        }

        checkUser();
    </script>
</body>
</html>
